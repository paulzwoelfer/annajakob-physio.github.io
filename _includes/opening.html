<section id="{{ section.section_id }}" class="section section--opening" aria-labelledby="{{ section.section_id }}-heading">
  <div class="container">
    <div class="opening-card fade-up">
      <span class="section-eyebrow">Erreichbarkeit</span>
      <h2 class="section-title" id="{{ section.section_id }}-heading">{{ section.title }}</h2>
      <div class="section-line" aria-hidden="true"></div>
      <p>{{ section.text }}</p>
      {% if section.tage %}
        <ul class="opening-card__times" role="list">
          {% for tage in section.tage %}
            <li><strong>{{ tage.tag }}</strong><span>{{ tage.zeit }}</span></li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  </div>
</section>
