<section id="{{ section.section_id }}" class="section section--address" aria-labelledby="{{ section.section_id }}-heading">
  <div class="container address">
    <div class="address__content">
      <span class="section-eyebrow">Standort</span>
      <h2 class="section-title" id="{{ section.section_id }}-heading">{{ section.title }}</h2>
      <div class="section-line section-line--left" aria-hidden="true"></div>
      <p class="address__intro">{{ section.text | strip_html }}</p>

      <div class="address__info">
        <address class="address__block">
          <svg viewBox="0 0 24 24" stroke-width="2" fill="none" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <p>
            <strong>{{ site.praxis_name }}</strong>
            <span>{{ section.adresse }}</span>
          </p>
        </address>
        <a href="https://maps.google.com/?q={{ section.adresse | uri_escape }}" target="_blank" rel="noopener noreferrer" class="address__route" aria-label="Route in Google Maps planen">
          <svg viewBox="0 0 24 24" stroke-width="2" fill="none" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
          Route planen
        </a>
      </div>

      <div class="address__map">
        <iframe
          src="https://www.google.com/maps?q={{ section.adresse | uri_escape }}&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Karte: {{ site.praxis_name }}, {{ section.adresse }}"
        ></iframe>
      </div>
    </div>

    <div class="address__media">
      <div class="address__image-wrap">
        <img src="{{ section.logo | relative_url }}" alt="{{ site.praxis_name }} - {{ section.adresse }}" loading="lazy" />
      </div>
    </div>
  </div>
</section>
