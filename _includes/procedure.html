<section id="{{ section.section_id }}" class="section section--procedure" aria-labelledby="{{ section.section_id }}-heading">
  <div class="container procedure">
    <div class="procedure__intro">
      <span class="section-eyebrow">Wie es funktioniert</span>
      <h2 class="section-title" id="{{ section.section_id }}-heading">{{ section.title }}</h2>
      <div class="section-line section-line--left" aria-hidden="true"></div>
      <p class="procedure__text">{{ section.text }}</p>
    </div>

    <div class="procedure__requirements fade-up">
      <h3>Die Verordnung sollte enthalten</h3>
      <ol class="procedure__steps" aria-label="Erforderliche Angaben auf der Verordnung">
        {% for item in section.list %}
          <li>
            <div class="procedure__step-num" aria-hidden="true">{{ forloop.index }}</div>
            <p class="procedure__step-copy">{{ item }}</p>
          </li>
        {% endfor %}
      </ol>
    </div>

    <div class="procedure__outro fade-up">
      <p class="procedure__text">{{ section.text2 }}</p>
      <div class="procedure__quote">
        <p>{{ section.text3 }}</p>
      </div>
    </div>
  </div>
</section>
