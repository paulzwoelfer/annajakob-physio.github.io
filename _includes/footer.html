<footer class="site-footer" role="contentinfo">
  <div class="container">
    <div class="site-footer__top">
      <a class="site-footer__brand" href="{{ '/#hero' | relative_url }}" aria-label="Zur Startseite von Anna Jakob Physiotherapie">
        <img src="{{ site.logo | relative_url }}" alt="Logo Physiotherapie Anna Jakob" />
        <div>
          <div class="site-footer__name">{{ site.name }}</div>
          <div class="site-footer__title">{{ site.subtitle }} <span aria-hidden="true">·</span> Graz</div>
        </div>
      </a>

      <nav aria-label="Footer-Navigation">
        <ul class="site-footer__nav" role="list">
          <li><a href="{{ '/impressum' | relative_url }}">Impressum</a></li>
          <li><a href="{{ '/datenschutz' | relative_url }}">Datenschutz</a></li>
        </ul>
      </nav>
    </div>

    <div class="site-footer__bottom">
      <p>© <span id="footerYear"></span> {{ site.name }} <span aria-hidden="true">- </span>Physiotherapie Graz. Alle Rechte vorbehalten.</p>
    </div>
  </div>
</footer>
