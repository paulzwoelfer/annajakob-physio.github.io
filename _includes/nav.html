<nav id="mainNav" class="site-nav" role="navigation" aria-label="Hauptnavigation">
  <div class="site-nav__inner container">
    <a class="site-nav__brand" href="{{ '/#hero' | relative_url }}" aria-label="Anna Jakob Physiotherapie - zur Startseite">
      <img src="{{ site.logo | relative_url }}" alt="Logo Physiotherapie Anna Jakob" />
      <div class="site-nav__brand-text">
        <span class="site-nav__name">{{ site.name }}</span>
        <span class="site-nav__title">{{ site.subtitle }}</span>
      </div>
    </a>

    <button class="site-nav__toggle" id="navToggle" type="button" aria-controls="navLinks" aria-expanded="false" aria-label="Menü öffnen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="site-nav__links" id="navLinks" role="list">
      {% for item in site.data.menus.header %}
        <li>
          <a href="{{ item.url | relative_url }}" class="{% if item.highlight %}is-highlight{% endif %}">{{ item.title }}</a>
        </li>
      {% endfor %}
      <li>
        <a href="{{ '/#termin' | relative_url }}" class="is-button">Jetzt buchen</a>
      </li>
    </ul>
  </div>
</nav>
