<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}" />
    <meta property="og:site_name" content="{{ site.og_site_name }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{ site.url }}{{ site.og_image | relative_url }}" />
    <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}" />
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" />
    <link rel="manifest" href="{{ '/assets/images/site.webmanifest' | relative_url }}" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body id="page-top" class="site-shell {% if page.layout == site.landing_template %}landing{% endif %} page-slug-{{ page.permalink | default: page.title | default: 'default' | slugify }}">
    <a class="skip-link" href="#main-content">Zum Hauptinhalt springen</a>
    {% include nav.html site=site page=page %}
    {{ content }}
    {% include footer.html site=site page=page %}
    <script src="{{ 'assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
